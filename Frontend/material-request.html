<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>FabricPro — Material Request</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body { background:var(--bg); min-height:100vh; }
    .page-wrap { max-width:480px; margin:0 auto; padding:0 0 30px; }
    .top-bar { background:var(--surface); border-bottom:1px solid var(--border-light); padding:0 16px; height:60px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:100; box-shadow:var(--shadow-sm); }
    .back-btn { display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer;background:none;transition:all .2s; }
    .back-btn:hover { background:var(--bg);border-color:var(--primary); }
    .back-btn svg { width:18px;height:18px; }
    .hero { background:linear-gradient(135deg,#EA580C,#F59E0B); padding:28px 20px; color:#fff; border-radius:0 0 24px 24px; margin-bottom:24px; text-align:center; }
    .hero svg { width:52px;height:52px;margin:0 auto 12px;opacity:.9; }
    .hero h2 { font-size:1.3rem;font-weight:800;margin-bottom:4px; }
    .hero p { font-size:.85rem;opacity:.8; }
    .content-pad { padding:0 16px; }
    .card-form { background:var(--surface);border:1px solid var(--border-light);border-radius:16px;padding:20px;margin-bottom:16px; }
    .material-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px; }
    .material-btn { border:2px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .2s;font-size:.8rem;font-weight:600;color:var(--text-secondary);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px; }
    .material-btn:hover,.material-btn.selected { border-color:var(--warning);color:#92400E;background:#FFFBEB; }
    .material-btn svg { width:24px;height:24px; }
    .urgency-grid { display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px; }
    .urgency-btn { border:2px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;transition:all .2s;font-size:.78rem;font-weight:600;color:var(--text-secondary);background:var(--surface); }
    .urgency-btn.selected-normal { border-color:#059669;color:#059669;background:#ECFDF5; }
    .urgency-btn.selected-urgent { border-color:#F59E0B;color:#92400E;background:#FFFBEB; }
    .urgency-btn.selected-critical { border-color:#EF4444;color:#991B1B;background:#FEF2F2; }
    .qty-row { display:flex;align-items:center;gap:12px; }
    .qty-input { flex:1; }
    .recent-item { display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;border:1px solid var(--border-light);background:var(--surface);margin-bottom:8px; }
    .submit-section { padding:0 16px; }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="top-bar">
      <button class="back-btn" data-action="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h2 style="font-size:1rem;" data-i18n="materialRequest">Material Request</h2>
    </div>

    <div class="hero">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
      <h2 data-i18n="materialRequest">Material Request</h2>
      <p>Request materials you need for your work</p>
    </div>

    <form id="materialForm">
    <div class="content-pad">
      <!-- Material Type -->
      <div class="card-form">
        <label class="form-label" style="margin-bottom:12px;" data-i18n="materialType">Material Type</label>
        <div class="material-grid">
          <div class="material-btn selected" data-action="select-material" data-type="cloth">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3"/></svg>
            <span data-i18n="cloth">Cloth</span>
          </div>
          <div class="material-btn" data-action="select-material" data-type="thread">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
            <span data-i18n="thread">Thread</span>
          </div>
          <div class="material-btn" data-action="select-material" data-type="buttons">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
            <span data-i18n="buttons">Buttons</span>
          </div>
          <div class="material-btn" data-action="select-material" data-type="zipper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5"/></svg>
            <span data-i18n="zipper">Zipper</span>
          </div>
          <div class="material-btn" data-action="select-material" data-type="liner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
            <span data-i18n="liner">Liner</span>
          </div>
          <div class="material-btn" data-action="select-material" data-type="other">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            <span data-i18n="otherMaterial">Other</span>
          </div>
        </div>
      </div>

      <!-- Quantity & Unit -->
      <div class="card-form">
        <div class="form-group">
          <label class="form-label" data-i18n="quantity">Quantity</label>
          <div class="qty-row">
            <input type="number" class="form-input qty-input" id="qty" value="5" min="1" placeholder="Amount"/>
            <select class="form-select" style="width:130px;" id="unitSel">
              <option value="meters" data-i18n="meters">Meters</option>
              <option value="pieces" data-i18n="pieces">Pieces</option>
              <option value="rolls" data-i18n="rolls">Rolls</option>
              <option value="kg">Kilograms</option>
            </select>
          </div>
        </div>
        <div class="form-group" id="colorGroup">
          <label class="form-label">Color / Specification</label>
          <input type="text" class="form-input" id="spec" placeholder="e.g. Navy Blue, 120cm width"/>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">Additional Notes</label>
          <textarea class="form-textarea" id="notes" style="min-height:70px;" placeholder="Any specific requirements..."></textarea>
        </div>
      </div>

      <!-- Urgency -->
      <div class="card-form">
        <label class="form-label" style="margin-bottom:10px;" data-i18n="urgency">Urgency Level</label>
        <div class="urgency-grid">
          <div class="urgency-btn selected-normal" data-action="select-urgency" data-urgency="normal">
            <div style="font-size:1.2rem;margin-bottom:4px;">🟢</div>
            <span data-i18n="normal">Normal</span>
          </div>
          <div class="urgency-btn" data-action="select-urgency" data-urgency="urgent">
            <div style="font-size:1.2rem;margin-bottom:4px;">🟡</div>
            <span data-i18n="urgent">Urgent</span>
          </div>
          <div class="urgency-btn" data-action="select-urgency" data-urgency="critical">
            <div style="font-size:1.2rem;margin-bottom:4px;">🔴</div>
            <span data-i18n="critical">Critical</span>
          </div>
        </div>
      </div>

      <!-- Recent Requests -->
      <h3 style="font-size:.9rem;font-weight:700;margin-bottom:10px;">Recent Requests</h3>
      <div id="recentRequestsList">
        <div class="recent-item">
          <div>
            <div style="font-size:.88rem;font-weight:600;">Loading recent requests...</div>
          </div>
        </div>
      </div>
    </div>

    <div class="submit-section" style="margin-top:20px;">
      <button class="btn btn-warning btn-w-full btn-lg" type="submit" style="background:linear-gradient(135deg,#EA580C,#F59E0B);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4 20-7z"/></svg>
        <span data-i18n="submitRequest">Submit Request</span>
      </button>
    </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
