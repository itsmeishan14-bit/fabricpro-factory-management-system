<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>FabricPro — Leave Request</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body { background:var(--bg); min-height:100vh; }
    .page-wrap { max-width:480px; margin:0 auto; padding:0 0 30px; }
    .top-bar { background:var(--surface); border-bottom:1px solid var(--border-light); padding:0 16px; height:60px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:100; box-shadow:var(--shadow-sm); }
    .back-btn { display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer;transition:all .2s;background:none; }
    .back-btn:hover { background:var(--bg);border-color:var(--primary); }
    .back-btn svg { width:18px;height:18px; }
    .hero { background:linear-gradient(135deg,#059669,#0EA5E9); padding:28px 20px; color:#fff; border-radius:0 0 24px 24px; margin-bottom:24px; text-align:center; }
    .hero svg { width:52px;height:52px;margin:0 auto 12px;opacity:.9; }
    .hero h2 { font-size:1.3rem;font-weight:800;margin-bottom:4px; }
    .hero p { font-size:.85rem;opacity:.8; }
    .content-pad { padding:0 16px; }
    .card-form { background:var(--surface);border:1px solid var(--border-light);border-radius:16px;padding:20px;margin-bottom:16px; }
    .type-grid { display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:4px; }
    .type-btn { border:2px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s;font-size:.78rem;font-weight:600;color:var(--text-secondary);background:var(--surface); }
    .type-btn:hover,.type-btn.selected { border-color:var(--primary);color:var(--primary);background:var(--primary-light); }
    .type-btn svg { width:22px;height:22px;margin:0 auto 6px;display:block; }
    .history-item { display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;border:1px solid var(--border-light);background:var(--surface);margin-bottom:8px; }
    .history-item-left { display:flex;align-items:center;gap:10px; }
    .history-icon { width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center; }
    .submit-section { padding:0 16px 20px; }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="top-bar">
      <button class="back-btn" data-action="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h2 style="font-size:1rem;" data-i18n="leaveRequest">Leave Request</h2>
    </div>

    <div class="hero">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <h2 data-i18n="leaveRequest">Leave Request</h2>
      <p>Fill out the form below to apply for leave</p>
    </div>

    <div class="content-pad">
      <!-- Leave Type -->
      <div class="card-form">
        <label class="form-label">Leave Type</label>
        <div class="type-grid">
          <div class="type-btn selected" data-action="select-leave-type" data-type="casual">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            Casual
          </div>
          <div class="type-btn" data-action="select-leave-type" data-type="medical">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            Medical
          </div>
          <div class="type-btn" data-action="select-leave-type" data-type="personal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            Personal
          </div>
        </div>
      </div>

      <!-- Form -->
      <form id="leaveForm" class="card-form">
        <div class="form-group">
          <label class="form-label" for="leaveDate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span data-i18n="leaveDate">Leave Date</span>
          </label>
          <input type="date" id="leaveDate" class="form-input" required/>
        </div>
        <div class="form-group">
          <label class="form-label" for="leaveEnd">End Date (optional)</label>
          <input type="date" id="leaveEnd" class="form-input"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="leaveReason">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span data-i18n="leaveReason">Reason for Leave</span>
          </label>
          <textarea id="leaveReason" class="form-textarea" placeholder="Enter your reason..." required></textarea>
        </div>
      </form>

      <!-- Contact info box -->
      <div class="alert alert-info" style="margin-bottom:16px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>Leave requests must be submitted at least <strong>1 day in advance</strong>.</span>
      </div>

      <!-- History -->
      <h3 style="font-size:.9rem;font-weight:700;margin-bottom:10px;">Recent Leave History</h3>
      <div id="leaveHistoryList">
        <div class="history-item">
          <div>Loading leave history...</div>
        </div>
      </div>
    </div>

    <div class="submit-section" style="margin-top:20px;">
      <button class="btn btn-success btn-w-full btn-lg" type="submit" form="leaveForm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4 20-7z"/></svg>
        <span data-i18n="submitLeave">Submit Leave Request</span>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
