<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>FabricPro — Login</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 50%, #1D4ED8 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; position: relative; overflow: hidden;
    }
    body::before {
      content:''; position:absolute; width:600px; height:600px; border-radius:50%;
      background: radial-gradient(circle, rgba(37,99,235,.25), transparent 70%);
      top:-200px; right:-200px; pointer-events:none;
    }
    body::after {
      content:''; position:absolute; width:400px; height:400px; border-radius:50%;
      background: radial-gradient(circle, rgba(14,165,233,.2), transparent 70%);
      bottom:-150px; left:-100px; pointer-events:none;
    }
    .login-container { width:100%; max-width:440px; position:relative; z-index:1; }
    .login-card {
      background: rgba(255,255,255,.97); backdrop-filter:blur(20px);
      border-radius:24px; padding:40px 36px;
      box-shadow:0 32px 64px rgba(0,0,0,.25), 0 0 0 1px rgba(255,255,255,.1);
    }
    .login-header { text-align:center; margin-bottom:32px; }
    .login-logo {
      width:64px; height:64px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius:18px; display:flex; align-items:center; justify-content:center;
      margin:0 auto 16px; box-shadow:0 8px 24px rgba(37,99,235,.35);
    }
    .login-logo svg { width:32px; height:32px; color:#fff; }
    .login-header h1 { font-size:1.6rem; margin-bottom:4px; }
    .login-header p { color:var(--text-secondary); font-size:.9rem; }
    .lang-switch { display:flex; gap:8px; justify-content:flex-end; margin-bottom:24px; }
    .pass-toggle {
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      color:var(--text-muted); cursor:pointer; display:flex; align-items:center;
    }
    .pass-toggle:hover { color:var(--primary); }
    .pass-toggle svg { width:18px; height:18px; }
    .login-options {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:24px; font-size:.85rem;
    }
    .checkbox-wrap { display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text-secondary); }
    .checkbox-wrap input { width:16px; height:16px; accent-color:var(--primary); }
    .forgot-link { color:var(--primary); font-weight:600; }
    .forgot-link:hover { text-decoration:underline; }
    .login-btn {
      width:100%; padding:14px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color:#fff; border-radius:var(--radius); font-size:1rem; font-weight:600;
      box-shadow:0 8px 20px rgba(37,99,235,.35); transition:all .25s;
    }
    .login-btn:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(37,99,235,.45); }
    .error-msg {
      background:#FEF2F2; border:1px solid #FECACA; border-radius:var(--radius);
      padding:10px 14px; font-size:.85rem; color:#991B1B;
      margin-bottom:16px; display:flex; align-items:center; gap:8px;
    }
    .error-msg svg { width:16px; height:16px; flex-shrink:0; }
    .demo-hint {
      margin-top:20px; padding:14px; background:var(--bg);
      border-radius:var(--radius); font-size:.8rem; color:var(--text-secondary);
    }
    .demo-hint h4 { font-size:.78rem; font-weight:700; margin-bottom:6px; }
    .demo-hint code {
      background:rgba(37,99,235,.08); color:var(--primary);
      border-radius:4px; padding:2px 6px; font-family:monospace; font-size:.82rem;
    }
    .demo-hint .demo-row { display:flex; align-items:center; justify-content:space-between; padding:3px 0; }
    .footer-text { text-align:center; margin-top:20px; font-size:.78rem; color:rgba(255,255,255,.5); }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <h1 data-i18n="loginTitle">Welcome Back</h1>
        <p data-i18n="loginSub">Sign in to your account</p>
      </div>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="en">🌐 English</button>
        <button class="lang-btn" data-lang="ne">🇳🇵 नेपाली</button>
      </div>
      <form id="loginForm">
        <div id="errorMsg" class="error-msg hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>
          </svg>
          <span>Invalid username or password. Please try again.</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="username">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span data-i18n="username">Username</span>
          </label>
          <div class="input-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" class="form-input" placeholder="Username" autocomplete="username" required/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span data-i18n="password">Password</span>
          </label>
          <div class="input-icon-wrap" style="position:relative;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" class="form-input" placeholder="Password" autocomplete="current-password" required/>
            <span class="pass-toggle" id="passToggle">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </span>
          </div>
        </div>
        <div class="login-options">
          <label class="checkbox-wrap">
            <input type="checkbox" id="rememberMe"/>
            <span data-i18n="rememberMe">Remember me</span>
          </label>
          <a href="#" class="forgot-link" data-i18n="forgotPass">Forgot password?</a>
        </div>
        <button type="submit" class="login-btn">
          <span data-i18n="loginBtn">Sign In</span>
        </button>
      </form>
      <div class="demo-hint">
        <h4>🔑 Demo Credentials</h4>
        <div class="demo-row"><span>Owner (Admin):</span><span><code>admin</code> / <code>admin123</code></span></div>
        <div class="demo-row"><span>Worker:</span><span><code>worker1</code> / <code>pass123</code></span></div>
      </div>
    </div>
    <p class="footer-text">FabricPro Factory Management System &copy; 2025</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
